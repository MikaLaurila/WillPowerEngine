name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build and test output is also captured to files; on failure the first error lines are re-emitted
# as workflow annotations, which are readable through the public checks API without signing in.

jobs:
  linux:
    name: Linux GCC (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build gcc-14 g++-14
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
          libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev
          libdecor-0-dev libudev-dev libdbus-1-dev libpulse-dev libasound2-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          -DSANITIZERS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
      - name: Build
        run: set -o pipefail; cmake --build build 2>&1 | tee build.log
      - name: Test
        run: set -o pipefail; ctest --test-dir build --output-on-failure 2>&1 | tee test.log
      - name: Report errors
        if: failure()
        run: |
          touch build.log test.log
          grep -hE "error:|undefined reference|FAILED:|\[ FAIL \]|    FAIL |runtime error|ERROR: AddressSanitizer|ERROR: LeakSanitizer" build.log test.log \
            | head -n 25 | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

  windows:
    name: Windows MSYS2 UCRT64 (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: set -o pipefail; cmake --build build 2>&1 | tee build.log
      - name: Test
        run: set -o pipefail; ctest --test-dir build --output-on-failure 2>&1 | tee test.log
      - name: Report errors
        if: failure()
        run: |
          touch build.log test.log
          grep -hE "error:|undefined reference|FAILED:|\[ FAIL \]|    FAIL " build.log test.log \
            | head -n 25 | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
